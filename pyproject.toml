[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "why-this-chunk"
version = "0.1.0"
description = "A RAG retrieval explainer: why a chunk ranked where it did, what failed, and the one config change that fixes it."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "Mykola Podpriatov" }]
keywords = ["rag", "retrieval", "embeddings", "bm25", "explainability", "search"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.24",
    "rank-bm25>=0.2.2",
    "typer>=0.12",
    "rich>=13.0",
    "pydantic>=2.6",
]

[project.urls]
Homepage = "https://github.com/mykolapodpriatov/why-this-chunk"
Repository = "https://github.com/mykolapodpriatov/why-this-chunk"

[project.optional-dependencies]
st = ["sentence-transformers>=2.2"]
faiss = ["faiss-cpu>=1.7"]
web = ["fastapi>=0.110", "uvicorn>=0.29"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.10",
]

[project.scripts]
why-this-chunk = "why_this_chunk.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/why_this_chunk"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
]
ignore = [
    "B008", # function call in default argument (typer uses this pattern)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.mypy]
# Analysis target is 3.12 so mypy can parse modern dependency stubs (numpy 2.x
# uses 3.12 `type` statements in its .pyi files). The package itself targets
# 3.11+ at runtime; the CI test matrix exercises 3.11–3.13.
python_version = "3.12"
strict = true
files = ["src"]
warn_unreachable = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
no_implicit_optional = true
show_error_codes = true

# Optional-extra dependencies are imported inside guarded blocks; their stubs
# may be absent when the corresponding extra is not installed (e.g. CI installs
# only [dev]), so missing imports for them are ignored.
[[tool.mypy.overrides]]
module = [
    "rank_bm25.*",
    "sentence_transformers.*",
    "faiss.*",
    "fastapi.*",
    "uvicorn.*",
]
ignore_missing_imports = true

# The web inspector's FastAPI route decorators are typed as ``Any`` when the
# [web] extra is not installed (e.g. CI installs only [dev]), which strict mode
# would otherwise flag as untyped decorators. This module is optional and fully
# import-guarded, so that single check is relaxed here.
[[tool.mypy.overrides]]
module = ["why_this_chunk.web"]
disallow_untyped_decorators = false

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra"
testpaths = ["tests"]
filterwarnings = [
    "error",
]

[tool.coverage.run]
source = ["why_this_chunk"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@(abc\\.)?abstractmethod",
    "\\.\\.\\.",
]
