name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: lint + type + test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install package with dev extras
        run: python -m pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Mypy (strict on src)
        run: mypy src

      - name: Pytest with coverage
        run: pytest -q --cov=why_this_chunk --cov-report=term-missing

  adapters:
    name: vector-store adapters
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # The main matrix installs only [dev], so the adapter suites skip there.
      # Qdrant's `:memory:` mode runs in-process, and the pgvector suite drives
      # the adapter through a fake connection, so both exercise the real code
      # here with no service container and no network. The pgvector suite's
      # against-a-real-database half runs in the `pgvector` job below.
      - name: Upgrade pip
        run: python -m pip install --upgrade pip
      - name: Install package with the adapter extras
        run: python -m pip install -e ".[dev,qdrant,pg]"
      - name: Pytest (adapters)
        run: pytest -q tests/test_qdrant_adapter.py tests/test_pgvector_adapter.py

  pgvector:
    name: pgvector against PostgreSQL
    runs-on: ubuntu-latest
    # pgvector is the one adapter backend that cannot run in-process, so its
    # integration tests skip everywhere unless WHY_THIS_CHUNK_PG_DSN points at a
    # real database. This job is where it points at one.
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Upgrade pip
        run: python -m pip install --upgrade pip
      - name: Install package with the pg extra
        run: python -m pip install -e ".[dev,pg]"
      - name: Pytest (pgvector)
        env:
          WHY_THIS_CHUNK_PG_DSN: postgresql://postgres:postgres@127.0.0.1:5432/postgres
        run: pytest -q tests/test_pgvector_adapter.py
