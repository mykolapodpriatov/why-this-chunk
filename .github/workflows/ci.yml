name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: lint + type + test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install package with dev extras
        run: python -m pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Mypy (strict on src)
        run: mypy src

      - name: Pytest with coverage
        run: pytest -q --cov=why_this_chunk --cov-report=term-missing

  adapters:
    name: vector-store adapters
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # The main matrix installs only [dev], so the adapter suite skips there.
      # Qdrant's `:memory:` mode runs in-process, so exercising the real query
      # path here still needs no service container and no network.
      - name: Upgrade pip
        run: python -m pip install --upgrade pip
      - name: Install package with the qdrant extra
        run: python -m pip install -e ".[dev,qdrant]"
      - name: Pytest (adapters)
        run: pytest -q tests/test_qdrant_adapter.py
